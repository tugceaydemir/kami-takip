<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230A0A0A'/><text x='50' y='64' font-family='Arial,Helvetica,sans-serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'>kami</text></svg>">
<title>Kami — Product & Growth</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--surface2:#F3F4F6;--ink:#111827;--muted:#6B7280;
  --line:#E5E7EB;--accent:#E11922;--accent-soft:#FCE7E8;--accent-ink:#B00E17;
  --good:#10B981;--bad:#EF4444;--warn:#F59E0B;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,Consolas,monospace;
  --shadow:0 1px 3px rgba(17,24,39,.06),0 1px 2px rgba(17,24,39,.04);
}
@media(prefers-color-scheme:dark){:root{--bg:#0E1117;--surface:#161A22;--surface2:#1E232D;--ink:#E6E9EF;--muted:#9BA3AF;--line:#262C37;--accent:#F2434C;--accent-soft:#3A1C1F;--accent-ink:#FF8A8F;--good:#34D399;--bad:#F87171;--warn:#FBBF24;--shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0E1117;--surface:#161A22;--surface2:#1E232D;--ink:#E6E9EF;--muted:#9BA3AF;--line:#262C37;--accent:#F2434C;--accent-soft:#3A1C1F;--accent-ink:#FF8A8F;--good:#34D399;--bad:#F87171;--warn:#FBBF24;--shadow:0 1px 3px rgba(0,0,0,.4)}
:root[data-theme="light"]{--bg:#F6F7F9;--surface:#FFFFFF;--surface2:#F3F4F6;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--accent:#E11922;--accent-soft:#FCE7E8;--accent-ink:#B00E17;--good:#10B981;--bad:#EF4444;--warn:#F59E0B;--shadow:0 1px 3px rgba(17,24,39,.06),0 1px 2px rgba(17,24,39,.04)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 100px}
.logo{display:inline-flex;align-items:center;background:#0A0A0A;color:#fff;border-radius:9px;padding:6px 13px;font-weight:800;font-size:17px;line-height:1;letter-spacing:-.5px;flex:0 0 auto;border:1px solid rgba(255,255,255,.08)}
.logo.lg{font-size:30px;padding:11px 22px;border-radius:14px;margin:0 auto 14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.brand{display:flex;align-items:center;gap:11px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.brand .sub{color:var(--muted);font-size:12px;margin-top:1px}
.who{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600;color:var(--ink)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;padding:9px 15px;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn{color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.link{background:none;border:none;color:var(--muted);padding:2px;font-size:12.5px;cursor:pointer}
.btn.link:hover{color:var(--ink);text-decoration:underline}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 2px}
.tabs button{border:none;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:11px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--sans)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabhint{color:var(--muted);font-size:12.5px;margin:10px 2px 14px}
.addrow{display:flex;gap:8px;margin-bottom:16px}
.addrow input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--sans);font-size:14.5px;padding:11px 13px;box-shadow:var(--shadow)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
.task:hover{border-color:#D1D5DB}
:root[data-theme="dark"] .task:hover{border-color:#333B49}
.task.done{opacity:.6}
.trow{display:flex;align-items:flex-start;gap:12px;padding:14px 15px}
.cbx{appearance:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;flex:0 0 auto;cursor:pointer;position:relative;background:var(--surface);transition:background .15s,border-color .15s}
.cbx:hover{border-color:var(--accent)}
.cbx:checked{background:var(--accent);border-color:var(--accent)}
.cbx:checked::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tmain{flex:1;min-width:0}
.ttitle{font-size:14.5px;font-weight:600;word-break:break-word;letter-spacing:-.1px}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center}
.meta select,.meta input[type=text],.meta input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:5px 9px}
.meta input[type=text]{flex:1;min-width:150px}
.owner{background:var(--accent-soft)!important;color:var(--accent-ink)!important;font-weight:600;border-color:transparent!important}
.tdel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;opacity:0;transition:opacity .15s,color .15s}
.task:hover .tdel{opacity:.7}.tdel:hover{color:var(--bad);opacity:1}
.cmtbar{border-top:1px solid var(--line);background:var(--surface2)}
.cmttoggle{width:100%;text-align:left;border:none;background:none;color:var(--accent-ink);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:9px 15px;cursor:pointer}
.cmts{padding:0 15px 12px}
.cmt{font-size:13px;padding:8px 20px 8px 0;border-bottom:1px solid var(--line);position:relative}
.cmt:last-child{border-bottom:none}
.cmt .by{font-weight:700;color:var(--ink)}
.cmt .at{color:var(--muted);font-size:11px}
.cmt.sys{color:var(--muted);font-style:normal;font-size:12px}
.cmtdel{position:absolute;right:0;top:7px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;opacity:0}
.cmt:hover .cmtdel{opacity:.6}.cmtdel:hover{color:var(--bad);opacity:1}
.cmtadd{display:flex;gap:8px;margin-top:10px}
.cmtadd input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:var(--sans);font-size:13px;padding:8px 10px}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.small{color:var(--muted);font-size:12px}
.sync{font-size:11.5px;color:var(--muted)}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
#gate .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(17,24,39,.10)}
#gate h2{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.3px}
#gate p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
#gate input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:15px;padding:12px 14px;margin-bottom:10px}
#gate .btn{width:100%;padding:12px}
#gate .msg{margin-top:14px;font-size:13px;min-height:16px}
#gate .msg.ok{color:var(--good)}#gate .msg.err{color:var(--bad)}
.hidden{display:none!important}
#kcursor{box-sizing:border-box;position:fixed;top:0;left:0;width:9px;height:9px;background:var(--accent);border:2px solid transparent;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:9999;opacity:0;transition:width .18s ease,height .18s ease,background .18s,border-color .18s,opacity .25s}
#kcursor.hot{width:22px;height:22px;background:transparent;border-color:var(--accent)}
#kcursor.down{width:6px;height:6px;background:var(--accent);border-color:transparent}
@media(hover:none){#kcursor{display:none}}
@media(prefers-reduced-motion:reduce){#kcursor{display:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="logo lg">kami</div>
    <h2>Product &amp; Growth</h2>
    <p>Ekip panosu. Şirket e-postanla giriş yap.</p>
    <input type="email" id="email" placeholder="ad@cizgi.studio" autocomplete="email">
    <button class="btn" id="send">Giriş bağlantısı gönder</button>
    <div class="msg" id="gmsg"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">kami</div>
      <div><b>Product &amp; Growth</b><div class="sub">ekip panosu</div></div>
    </div>
    <div class="who"><span class="chip" id="uname"></span><span class="sync" id="sync"></span><button class="btn link" id="refresh">Yenile</button><button class="btn link" id="logout">Çıkış</button></div>
  </div>

  <div class="tabs">
    <button data-s="product" class="on">Product</button>
    <button data-s="growth">Growth</button>
  </div>
  <div class="tabhint" id="hint"></div>

  <div class="addrow">
    <input type="text" id="newtask" placeholder="Yeni iş ekle ve Enter'a bas…">
    <button class="btn" id="add">Ekle</button>
  </div>

  <div id="list"></div>
</div>

<script>
(function(){
"use strict";
var SUPA_URL="https://epqtdonorpyfqtqzzyos.supabase.co";
var SUPA_KEY="sb_publishable_LcIaK40Sh5SRMEw8S7HrlA_fgC7hpqD";
var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
var me=null, meName="", tasks=[], section="product", timers={}, lastWrite=0, rtTimer=null;
var OWNERS=["","Tuğçe","Berke","Yağmur","Abdul"];
function isEditing(){var a=document.activeElement;return !!(a&&a.closest&&a.closest("#list"));}
function softRefresh(){if(rtTimer)clearTimeout(rtTimer);rtTimer=setTimeout(function(){if(isEditing()){softRefresh();return;}loadBoard(false);},1500);}

function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
var NAMES={"tugce@cizgi.studio":"Tuğçe","ahmetberke@cizgi.studio":"Berke","yagmur@cizgi.studio":"Yağmur"};
function nameFromEmail(e){e=(e||"").toLowerCase().trim();return NAMES[e]||(e.split("@")[0]||"kullanıcı");}
function fmtDate(iso){if(!iso)return "";var d=new Date(iso);return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}
function setSync(t){document.getElementById("sync").textContent=t;}

// ---- auth
var gate=document.getElementById("gate"),app=document.getElementById("app");
document.getElementById("send").addEventListener("click",sendLink);
document.getElementById("email").addEventListener("keydown",function(e){if(e.key==="Enter")sendLink()});
function sendLink(){
  var email=document.getElementById("email").value.trim();var m=document.getElementById("gmsg");
  if(!email||email.indexOf("@")<0){m.className="msg err";m.textContent="Geçerli bir e-posta gir.";return}
  m.className="msg";m.textContent="Gönderiliyor…";
  sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split("#")[0]}}).then(function(r){
    if(r.error){m.className="msg err";m.textContent="Hata: "+r.error.message;}
    else{m.className="msg ok";m.textContent="Mailine giriş bağlantısı gönderildi. Bağlantıya tıkla. (Spam'e de bak.)";}
  });
}
document.getElementById("logout").addEventListener("click",function(){sb.auth.signOut().then(function(){location.reload()})});
sb.auth.getSession().then(function(r){if(r.data.session)onAuthed(r.data.session.user);else gate.classList.remove("hidden");});
sb.auth.onAuthStateChange(function(ev,s){if(ev==="SIGNED_IN"&&s&&!me)onAuthed(s.user);if(ev==="SIGNED_OUT"){location.reload();}});
function onAuthed(user){
  me=user; meName=nameFromEmail(user.email);
  gate.classList.add("hidden"); app.classList.remove("hidden");
  document.getElementById("uname").textContent=meName;
  loadBoard(false);
  try{ sb.channel("board").on("postgres_changes",{event:"*",schema:"public",table:"board_tasks"},function(){ if(Date.now()-lastWrite<3000)return; softRefresh(); }).subscribe(); }catch(e){}
  window.addEventListener("focus",function(){ if(!isEditing())loadBoard(false); });
}

// ---- tabs
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on"); section=b.dataset.s; render();
  });
});
var HINT={product:"Ürün işleri — onboarding, paywall, kapak, ana sayfa, AI chat, event'ler.",
          growth:"Growth işleri — attribution, kampanyalar, dashboard, LTV, monetizasyon."};

// ---- data
function loadBoard(seedIfEmpty){
  setSync("yükleniyor…");
  sb.from("board_tasks").select("*").order("sort",{ascending:false}).then(function(r){
    if(r.error){setSync("hata: "+r.error.message);return}
    tasks=r.data||[];
    setSync("güncel");
    if(seedIfEmpty && tasks.length===0){ seed(); return; }
    render();
  });
}
function seed(){
  var now=Date.now();
  var P=[["Onboarding tasarımı (UI/UX — Google Stitch)","Berke"],
         ["Ücretsiz bölüm / paywall testi (10→12)","Tuğçe"],
         ["Kapak görseli A/B testi","Tuğçe"],
         ["Ana sayfa düzeni: 'Kaldığın yerden devam et'","Berke"],
         ["AI chat karakter + prompt iyileştirme","Tuğçe"],
         ["Event taksonomisi (chapter_read, paywall_view...)","Abdul"]];
  var G=[["Branch attribution'ı doğrula (test satın alma)","Abdul"],
         ["Baseline funnel + gelir sayıları","Tuğçe"],
         ["TikTok Almanya-Türk kampanyası (ajans)","Tuğçe"],
         ["Admin panel KPI dashboard","Abdul"],
         ["LTV / CAC modeli","Tuğçe"],
         ["Rewarded video monetizasyon","Berke"],
         ["Anomali takibi rutini","Tuğçe"]];
  var rows=[]; var i=0;
  P.forEach(function(x){rows.push({section:"product",title:x[0],owner:x[1],status:"",done:false,comments:[],created_by:meName,sort:now+(i++)});});
  G.forEach(function(x){rows.push({section:"growth",title:x[0],owner:x[1],status:"",done:false,comments:[],created_by:meName,sort:now+(i++)});});
  sb.from("board_tasks").insert(rows).then(function(){loadBoard(false);});
}
function patch(id,obj){
  lastWrite=Date.now(); setSync("kaydediliyor…");
  sb.from("board_tasks").update(obj).eq("id",id).then(function(r){setSync(r.error?("hata: "+r.error.message):"kaydedildi");});
}
function debouncedPatch(id,field,val){
  var k=id+field; if(timers[k])clearTimeout(timers[k]);
  setSync("…"); timers[k]=setTimeout(function(){var o={};o[field]=val;patch(id,o);},600);
}

// ---- add / delete / comment
document.getElementById("add").addEventListener("click",addTask);
document.getElementById("newtask").addEventListener("keydown",function(e){if(e.key==="Enter")addTask()});
function addTask(){
  var el=document.getElementById("newtask"); var v=el.value.trim(); if(!v)return;
  el.value="";
  var row={section:section,title:v,owner:"",status:"",done:false,comments:[],created_by:meName,sort:Date.now()};
  lastWrite=Date.now(); setSync("ekleniyor…");
  sb.from("board_tasks").insert(row).select().then(function(r){
    if(r.error){setSync("hata: "+r.error.message);return}
    if(r.data&&r.data[0])tasks.unshift(r.data[0]); render(); setSync("eklendi");
  });
}
function delTask(t){
  if(!confirm("Bu iş silinsin mi? (herkes için)"))return;
  lastWrite=Date.now();
  sb.from("board_tasks").delete().eq("id",t.id).then(function(){tasks=tasks.filter(function(x){return x.id!==t.id});render();});
}
function addComment(t,text){
  var c=(t.comments||[]).slice(); c.push({by:meName,text:text,at:new Date().toISOString()});
  t.comments=c; patch(t.id,{comments:c}); render();
}

// ---- render
function render(){
  document.getElementById("hint").textContent=HINT[section]||"";
  var host=document.getElementById("list"); host.innerHTML="";
  var arr=tasks.filter(function(t){return t.section===section});
  if(!arr.length){host.innerHTML='<div class="empty">Bu bölümde henüz iş yok. Yukarıdan ekle.</div>';return}
  arr.forEach(function(t){
    var card=document.createElement("div"); card.className="task"+(t.done?" done":"");
    var trow=document.createElement("div"); trow.className="trow";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.className="cbx"; cb.checked=!!t.done;
    cb.onchange=function(){t.done=cb.checked;card.classList.toggle("done",cb.checked);patch(t.id,{done:cb.checked});};
    var main=document.createElement("div"); main.className="tmain";
    var title=document.createElement("div"); title.className="ttitle"; title.textContent=t.title;
    var meta=document.createElement("div"); meta.className="meta";
    var own=document.createElement("select"); own.className="owner";
    OWNERS.forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o?("Kimde: "+o):"Kimde: —";own.appendChild(op);});
    own.value=t.owner||""; own.onchange=function(){t.owner=own.value;var c=(t.comments||[]).slice();c.push({by:meName,text:"Devredildi → "+(own.value||"—"),at:new Date().toISOString(),sys:true});t.comments=c;patch(t.id,{owner:own.value,comments:c});render();};
    var st=document.createElement("input"); st.type="text"; st.placeholder="şu an ne durumda?"; st.value=t.status||"";
    st.oninput=function(){t.status=st.value;debouncedPatch(t.id,"status",st.value);};
    var dt=document.createElement("input"); dt.type="date"; dt.value=t.due||"";
    dt.onchange=function(){t.due=dt.value;patch(t.id,{due:dt.value||null});};
    meta.appendChild(own); meta.appendChild(st); meta.appendChild(dt);
    main.appendChild(title); main.appendChild(meta);
    var del=document.createElement("button"); del.className="tdel"; del.innerHTML="&times;"; del.onclick=function(){delTask(t);};
    trow.appendChild(cb); trow.appendChild(main); trow.appendChild(del);
    card.appendChild(trow);
    var bar=document.createElement("div"); bar.className="cmtbar";
    var n=(t.comments||[]).length;
    var tog=document.createElement("button"); tog.className="cmttoggle"; tog.textContent="Notlar / yorumlar ("+n+")";
    var box=document.createElement("div"); box.className="cmts hidden";
    tog.onclick=function(){box.classList.toggle("hidden");};
    (t.comments||[]).forEach(function(c,ci){
      var d=document.createElement("div"); d.className="cmt"+(c.sys?" sys":"");
      if(c.sys){ d.innerHTML=esc(c.text)+' <span class="at">— '+esc(c.by)+", "+esc(fmtDate(c.at))+'</span>'; }
      else { d.innerHTML='<span class="by">'+esc(c.by)+'</span> <span class="at">'+esc(fmtDate(c.at))+'</span><br>'+esc(c.text); }
      var x=document.createElement("button"); x.className="cmtdel"; x.innerHTML="&times;"; x.title="Notu sil";
      x.onclick=function(){if(!confirm("Not silinsin mi?"))return;var arr=(t.comments||[]).slice();arr.splice(ci,1);t.comments=arr;patch(t.id,{comments:arr});render();};
      d.appendChild(x);
      box.appendChild(d);
    });
    var add=document.createElement("div"); add.className="cmtadd";
    var ci=document.createElement("input"); ci.type="text"; ci.placeholder="Not bırak ("+meName+")…";
    var cbtn=document.createElement("button"); cbtn.className="btn sm"; cbtn.textContent="Gönder";
    function sendC(){var v=ci.value.trim();if(!v)return;ci.value="";addComment(t,v);}
    cbtn.onclick=sendC; ci.onkeydown=function(e){if(e.key==="Enter")sendC()};
    add.appendChild(ci); add.appendChild(cbtn); box.appendChild(add);
    bar.appendChild(tog); bar.appendChild(box);
    card.appendChild(bar);
    host.appendChild(card);
  });
}
document.getElementById("refresh").addEventListener("click",function(){loadBoard(false);});
})();
// ---- ozel imlec (kirmizi takip halkasi)
(function(){
  try{
    if(matchMedia("(hover:none)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var c=document.createElement("div"); c.id="kcursor"; document.body.appendChild(c);
    var x=innerWidth/2,y=innerHeight/2,cx=x,cy=y,shown=false;
    addEventListener("mousemove",function(e){x=e.clientX;y=e.clientY;if(!shown){shown=true;c.style.opacity=1;}
      var t=e.target; c.classList.toggle("hot", !!(t&&t.closest&&t.closest("button,a,input,select,textarea,.cbx,.task")));});
    addEventListener("mousedown",function(){c.classList.add("down")});
    addEventListener("mouseup",function(){c.classList.remove("down")});
    addEventListener("mouseleave",function(){c.style.opacity=0;shown=false;});
    (function loop(){cx+=(x-cx)*0.32;cy+=(y-cy)*0.32;c.style.left=cx+"px";c.style.top=cy+"px";requestAnimationFrame(loop);})();
  }catch(e){}
})();
</script>
</body>
</html>
