<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='34' fill='%23F6C338'/><circle cx='42' cy='49' r='4' fill='%232E2620'/><circle cx='58' cy='49' r='4' fill='%232E2620'/><polygon points='50,57 43,63 57,63' fill='%23E9822E'/></svg>">
<title>Kami — Product & Growth Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FBF5E9;--surface:#FFFDF7;--surface2:#F3EAD6;--ink:#2E2620;--muted:#8C8271;
  --line:#E9DFC8;--chick:#F6C338;--chick2:#E9A82E;--beak:#E9822E;
  --accent:#4C9E86;--accent-soft:#E1F0EA;--accent-ink:#2F6F5C;--good:#4C9E86;--bad:#C86B4A;--warn:#C79A34;--blue:#3E6DB5;--blue-soft:#E3ECF7;
  --serif:Georgia,'Palatino Linotype',serif;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:Consolas,ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root{--bg:#211C2B;--surface:#2A2436;--surface2:#332C42;--ink:#F0E9DE;--muted:#A79BB0;--line:#3B3350;--accent:#6FC3A6;--accent-soft:#263A38;--accent-ink:#9FE3CD;--good:#6FC3A6;--bad:#E28A6B;--warn:#E0BB55;--blue:#7FA8E0;--blue-soft:#26304A;}}
:root[data-theme="dark"]{--bg:#211C2B;--surface:#2A2436;--surface2:#332C42;--ink:#F0E9DE;--muted:#A79BB0;--line:#3B3350;--accent:#6FC3A6;--accent-soft:#263A38;--accent-ink:#9FE3CD;--good:#6FC3A6;--bad:#E28A6B;--warn:#E0BB55;--blue:#7FA8E0;--blue-soft:#26304A;}
:root[data-theme="light"]{--bg:#FBF5E9;--surface:#FFFDF7;--surface2:#F3EAD6;--ink:#2E2620;--muted:#8C8271;--line:#E9DFC8;--accent:#4C9E86;--accent-soft:#E1F0EA;--accent-ink:#2F6F5C;--good:#4C9E86;--bad:#C86B4A;--warn:#C79A34;--blue:#3E6DB5;--blue-soft:#E3ECF7;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:800px;margin:0 auto;padding:0 16px 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.chick{width:44px;height:44px;transform-origin:50% 90%;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.chick{animation:none}}
.brand b{font-family:var(--serif);font-size:19px}
.brand .sub{color:var(--muted);font-size:12px}
.who{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.who .btn{margin-left:6px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;font-weight:600;font-size:14px;padding:8px 14px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
:root[data-theme="dark"] .btn{color:#0E1513}@media(prefers-color-scheme:dark){.btn{color:#0E1513}}:root[data-theme="light"] .btn{color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--accent-ink)}
.btn.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:2px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:8px;margin:18px 0 6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--serif);font-size:17px;font-weight:700;padding:12px;border-radius:12px 12px 0 0;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .tabs button.on{color:#0E1513}
.tabhint{color:var(--muted);font-size:12.5px;margin:2px 2px 12px}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--sans);font-size:15px;padding:11px 13px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.task.done{opacity:.72}
.trow{display:flex;align-items:flex-start;gap:11px;padding:12px 14px}
.cbx{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:1px 0 0;flex:0 0 auto;cursor:pointer;position:relative;background:var(--surface)}
.cbx:checked{background:var(--chick);border-color:var(--chick2)}
.cbx:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tmain{flex:1;min-width:0}
.ttitle{font-size:15px;font-weight:600;word-break:break-word}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.meta select,.meta input[type=text],.meta input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:5px 8px}
.meta input[type=text]{flex:1;min-width:140px}
.owner{background:var(--blue-soft)!important;color:var(--blue)!important;font-weight:600}
.tdel{border:none;background:none;color:var(--bad);cursor:pointer;font-size:20px;line-height:1;opacity:.5}
.tdel:hover{opacity:1}
.cmtbar{border-top:1px solid var(--line);background:var(--surface2)}
.cmttoggle{width:100%;text-align:left;border:none;background:none;color:var(--accent-ink);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;cursor:pointer}
.cmts{padding:0 14px 10px}
.cmt{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cmt:last-child{border-bottom:none}
.cmt .by{font-weight:700;color:var(--accent-ink)}
.cmt .at{color:var(--muted);font-size:11px}
.cmtadd{display:flex;gap:8px;margin-top:8px}
.cmtadd input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--sans);font-size:13px;padding:7px 9px}
.empty{color:var(--muted);font-style:italic;padding:20px;text-align:center}
.small{color:var(--muted);font-size:12px}
.sync{font-size:11.5px;color:var(--muted)}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
#gate .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;max-width:390px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#gate h2{font-family:var(--serif);font-size:22px;margin:8px 0 4px}
#gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px;font-family:var(--serif);font-style:italic}
#gate input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:16px;padding:12px 14px;margin-bottom:10px}
#gate .btn{width:100%;padding:12px}
#gate .msg{margin-top:14px;font-size:13px;min-height:16px}
#gate .msg.ok{color:var(--good)}#gate .msg.err{color:var(--bad)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <svg class="chick" viewBox="0 0 100 100" width="72" height="72" style="margin:0 auto;animation:none"><path d="M38 92 l-4 6 M46 92 l0 7 M58 92 l4 6 M54 92 l0 7" stroke="#E9822E" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="50" cy="58" rx="35" ry="33" fill="#F6C338"/><g><circle cx="42" cy="50" r="3.6" fill="#2E2620"/><circle cx="60" cy="50" r="3.6" fill="#2E2620"/></g><polygon points="51,58 43,64 59,64" fill="#E9822E"/></svg>
    <h2>Kami Product &amp; Growth Board</h2>
    <p>Ekip panosu — giriş yap, hep birlikte görelim.</p>
    <input type="email" id="email" placeholder="cizgi.studio e-postan" autocomplete="email">
    <button class="btn" id="send">Giriş bağlantısı gönder</button>
    <div class="msg" id="gmsg"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="topbar">
    <div class="brand">
      <svg class="chick" viewBox="0 0 100 100"><path d="M38 92 l-4 6 M46 92 l0 7 M58 92 l4 6 M54 92 l0 7" stroke="#E9822E" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="50" cy="58" rx="35" ry="33" fill="#F6C338"/><g><circle cx="42" cy="50" r="3.6" fill="#2E2620"/><circle cx="60" cy="50" r="3.6" fill="#2E2620"/></g><polygon points="51,58 43,64 59,64" fill="#E9822E"/></svg>
      <div><b>Product &amp; Growth Board</b><div class="sub">Kami ekip takibi</div></div>
    </div>
    <div class="who"><span id="uname"></span> <span class="sync" id="sync"></span><button class="btn link" id="refresh">yenile</button><button class="btn link" id="logout">çıkış</button></div>
  </div>

  <div class="tabs">
    <button data-s="product" class="on">Product</button>
    <button data-s="growth">Growth</button>
  </div>
  <div class="tabhint" id="hint"></div>

  <div class="addrow">
    <input type="text" id="newtask" placeholder="Yeni iş ekle ve Enter'a bas…">
    <button class="btn" id="add">Ekle</button>
  </div>

  <div id="list"></div>
</div>

<script>
(function(){
"use strict";
var SUPA_URL="https://epqtdonorpyfqtqzzyos.supabase.co";
var SUPA_KEY="sb_publishable_LcIaK40Sh5SRMEw8S7HrlA_fgC7hpqD";
var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
var me=null, meName="", tasks=[], section="product", timers={};
var OWNERS=["","Tuğçe","Berke","Yağmur","Abdul"];

function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
var NAMES={"tugce@cizgi.studio":"Tuğçe","ahmetberke@cizgi.studio":"Berke","yagmur@cizgi.studio":"Yağmur"};
function nameFromEmail(e){e=(e||"").toLowerCase().trim();return NAMES[e]||(e.split("@")[0]||"kullanıcı");}
function fmtDate(iso){if(!iso)return "";var d=new Date(iso);return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}
function setSync(t){document.getElementById("sync").textContent=t;}

// ---- auth
var gate=document.getElementById("gate"),app=document.getElementById("app");
document.getElementById("send").addEventListener("click",sendLink);
document.getElementById("email").addEventListener("keydown",function(e){if(e.key==="Enter")sendLink()});
function sendLink(){
  var email=document.getElementById("email").value.trim();var m=document.getElementById("gmsg");
  if(!email||email.indexOf("@")<0){m.className="msg err";m.textContent="Geçerli bir e-posta gir.";return}
  m.className="msg";m.textContent="Gönderiliyor…";
  sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split("#")[0]}}).then(function(r){
    if(r.error){m.className="msg err";m.textContent="Hata: "+r.error.message;}
    else{m.className="msg ok";m.textContent="Mailine giriş bağlantısı gönderildi. Bağlantıya tıkla. (Spam'e de bak.)";}
  });
}
document.getElementById("logout").addEventListener("click",function(){sb.auth.signOut().then(function(){location.reload()})});
sb.auth.getSession().then(function(r){if(r.data.session)onAuthed(r.data.session.user);else gate.classList.remove("hidden");});
sb.auth.onAuthStateChange(function(ev,s){if(ev==="SIGNED_IN"&&s&&!me)onAuthed(s.user);if(ev==="SIGNED_OUT"){location.reload();}});
function onAuthed(user){
  me=user; meName=nameFromEmail(user.email);
  gate.classList.add("hidden"); app.classList.remove("hidden");
  document.getElementById("uname").textContent=meName;
  loadBoard(true);
  try{ sb.channel("board").on("postgres_changes",{event:"*",schema:"public",table:"board_tasks"},function(){loadBoard(false);}).subscribe(); }catch(e){}
  window.addEventListener("focus",function(){loadBoard(false);});
}

// ---- tabs
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on"); section=b.dataset.s; render();
  });
});
var HINT={product:"Ürün işleri — onboarding, paywall, kapak, ana sayfa, AI chat, event'ler.",
          growth:"Growth işleri — attribution, kampanyalar, dashboard, LTV, monetizasyon."};

// ---- data
function loadBoard(seedIfEmpty){
  setSync("yükleniyor…");
  sb.from("board_tasks").select("*").order("sort",{ascending:true}).then(function(r){
    if(r.error){setSync("hata: "+r.error.message);return}
    tasks=r.data||[];
    setSync("güncel");
    if(seedIfEmpty && tasks.length===0){ seed(); return; }
    render();
  });
}
function seed(){
  var now=Date.now();
  var P=[["Onboarding tasarımı (UI/UX — Google Stitch)","Berke"],
         ["Ücretsiz bölüm / paywall testi (10→12)","Tuğçe"],
         ["Kapak görseli A/B testi","Tuğçe"],
         ["Ana sayfa düzeni: 'Kaldığın yerden devam et'","Berke"],
         ["AI chat karakter + prompt iyileştirme","Tuğçe"],
         ["Event taksonomisi (chapter_read, paywall_view...)","Abdul"]];
  var G=[["Branch attribution'ı doğrula (test satın alma)","Abdul"],
         ["Baseline funnel + gelir sayıları","Tuğçe"],
         ["TikTok Almanya-Türk kampanyası (ajans)","Tuğçe"],
         ["Admin panel KPI dashboard","Abdul"],
         ["LTV / CAC modeli","Tuğçe"],
         ["Rewarded video monetizasyon","Berke"],
         ["Anomali takibi rutini","Tuğçe"]];
  var rows=[]; var i=0;
  P.forEach(function(x){rows.push({section:"product",title:x[0],owner:x[1],status:"",done:false,comments:[],created_by:meName,sort:now+(i++)});});
  G.forEach(function(x){rows.push({section:"growth",title:x[0],owner:x[1],status:"",done:false,comments:[],created_by:meName,sort:now+(i++)});});
  sb.from("board_tasks").insert(rows).then(function(){loadBoard(false);});
}
function patch(id,obj){
  setSync("kaydediliyor…");
  sb.from("board_tasks").update(obj).eq("id",id).then(function(r){setSync(r.error?("hata: "+r.error.message):"kaydedildi");});
}
function debouncedPatch(id,field,val){
  var k=id+field; if(timers[k])clearTimeout(timers[k]);
  setSync("…"); timers[k]=setTimeout(function(){var o={};o[field]=val;patch(id,o);},600);
}

// ---- add / delete / comment
document.getElementById("add").addEventListener("click",addTask);
document.getElementById("newtask").addEventListener("keydown",function(e){if(e.key==="Enter")addTask()});
function addTask(){
  var el=document.getElementById("newtask"); var v=el.value.trim(); if(!v)return;
  el.value="";
  var row={section:section,title:v,owner:"",status:"",done:false,comments:[],created_by:meName,sort:Date.now()};
  setSync("ekleniyor…");
  sb.from("board_tasks").insert(row).select().then(function(r){
    if(r.error){setSync("hata: "+r.error.message);return}
    if(r.data&&r.data[0])tasks.push(r.data[0]); render(); setSync("eklendi");
  });
}
function delTask(t){
  if(!confirm("Bu iş silinsin mi? (herkes için)"))return;
  sb.from("board_tasks").delete().eq("id",t.id).then(function(){tasks=tasks.filter(function(x){return x.id!==t.id});render();});
}
function addComment(t,text){
  var c=(t.comments||[]).slice(); c.push({by:meName,text:text,at:new Date().toISOString()});
  t.comments=c; patch(t.id,{comments:c}); render();
}

// ---- render
function render(){
  document.getElementById("hint").textContent=HINT[section]||"";
  var host=document.getElementById("list"); host.innerHTML="";
  var arr=tasks.filter(function(t){return t.section===section});
  if(!arr.length){host.innerHTML='<div class="empty">Bu bölümde henüz iş yok. Yukarıdan ekle.</div>';return}
  arr.forEach(function(t){
    var card=document.createElement("div"); card.className="task"+(t.done?" done":"");
    // ust satir
    var trow=document.createElement("div"); trow.className="trow";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.className="cbx"; cb.checked=!!t.done;
    cb.onchange=function(){t.done=cb.checked;card.classList.toggle("done",cb.checked);patch(t.id,{done:cb.checked});};
    var main=document.createElement("div"); main.className="tmain";
    var title=document.createElement("div"); title.className="ttitle"; title.textContent=t.title;
    var meta=document.createElement("div"); meta.className="meta";
    // owner
    var own=document.createElement("select"); own.className="owner";
    OWNERS.forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o?("Kimde: "+o):"Kimde: —";own.appendChild(op);});
    own.value=t.owner||""; own.onchange=function(){t.owner=own.value;patch(t.id,{owner:own.value});};
    // status
    var st=document.createElement("input"); st.type="text"; st.placeholder="şu an ne durumda?"; st.value=t.status||"";
    st.oninput=function(){t.status=st.value;debouncedPatch(t.id,"status",st.value);};
    // date
    var dt=document.createElement("input"); dt.type="date"; dt.value=t.due||"";
    dt.onchange=function(){t.due=dt.value;patch(t.id,{due:dt.value||null});};
    meta.appendChild(own); meta.appendChild(st); meta.appendChild(dt);
    main.appendChild(title); main.appendChild(meta);
    var del=document.createElement("button"); del.className="tdel"; del.innerHTML="&times;"; del.onclick=function(){delTask(t);};
    trow.appendChild(cb); trow.appendChild(main); trow.appendChild(del);
    card.appendChild(trow);
    // yorumlar
    var bar=document.createElement("div"); bar.className="cmtbar";
    var n=(t.comments||[]).length;
    var tog=document.createElement("button"); tog.className="cmttoggle"; tog.textContent="Notlar / yorumlar ("+n+")";
    var box=document.createElement("div"); box.className="cmts hidden";
    tog.onclick=function(){box.classList.toggle("hidden");};
    (t.comments||[]).forEach(function(c){
      var d=document.createElement("div"); d.className="cmt";
      d.innerHTML='<span class="by">'+esc(c.by)+'</span> <span class="at">'+esc(fmtDate(c.at))+'</span><br>'+esc(c.text);
      box.appendChild(d);
    });
    var add=document.createElement("div"); add.className="cmtadd";
    var ci=document.createElement("input"); ci.type="text"; ci.placeholder="Not bırak ("+meName+")…";
    var cbtn=document.createElement("button"); cbtn.className="btn sm"; cbtn.textContent="Gönder";
    function sendC(){var v=ci.value.trim();if(!v)return;ci.value="";addComment(t,v);}
    cbtn.onclick=sendC; ci.onkeydown=function(e){if(e.key==="Enter")sendC()};
    add.appendChild(ci); add.appendChild(cbtn); box.appendChild(add);
    bar.appendChild(tog); bar.appendChild(box);
    card.appendChild(bar);
    host.appendChild(card);
  });
}
document.getElementById("refresh").addEventListener("click",function(){loadBoard(false);});
})();
</script>
</body>
</html>
